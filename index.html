    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is EVOLV Today?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "EVOLV Today is a cash-pay telehealth platform for physician-guided longevity, recovery, energy, sleep, metabolic health, body composition, skin, hair and sexual wellness. You complete a private online assessment, a licensed US clinician independently reviews it, and if treatment is appropriate a licensed US pharmacy prepares and ships it."
            }
          },
          {
            "@type": "Question",
            "name": "Are prescriptions guaranteed?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Completing an assessment does not guarantee a prescription. A licensed clinician independently reviews your information and prescribes only when medically appropriate. A clinician may also decline treatment, request more information, laboratory testing or a video visit."
            }
          },
          {
            "@type": "Question",
            "name": "When will I be charged?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your payment method may be securely authorized when you begin. The treatment charge is captured only after clinical approval according to the policy shown before checkout. If you are not prescribed, no treatment charge is captured."
            }
          },
          {
            "@type": "Question",
            "name": "Does EVOLV Today accept insurance?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "EVOLV Today is a cash-pay service and does not bill insurance. This keeps pricing transparent and the process simple. You are shown your plan price before you authorize payment."
            }
          },
          {
            "@type": "Question",
            "name": "Who provides medical care?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Care is provided by licensed clinicians in our network who are licensed to practice in your state. Every prescription decision is made independently by a provider; EVOLV Today does not decide whether you should receive treatment."
            }
          },
          {
            "@type": "Question",
            "name": "Are compounded medications FDA-approved?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Compounded medications are not FDA-approved. A licensed clinician determines whether a prescribed treatment is appropriate for each patient. Compounded medications are prepared by licensed pharmacies under applicable state and federal requirements."
            }
          }
        ]
      }
    </script>
